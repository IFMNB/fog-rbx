name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Release new game version
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install tools
        run: rokit install

      - name: Build release
        run: rojo build production.project.json -o build.rbxl

      - name: Publish to Roblox
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_CI_PLACE_ID }}
        run: |
          curl \
            --fail-with-body \
            --request POST \
            "https://apis.roblox.com/universes/v1/$ROBLOX_UNIVERSE_ID/places/$ROBLOX_PLACE_ID/versions?versionType=Published" \
            --header "x-api-key: $ROBLOX_OPEN_CLOUD_API_KEY" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @build.rbxl

      - name: Get latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')

          if [ -z "$latest" ]; then
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${latest#v}"

          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))

          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes